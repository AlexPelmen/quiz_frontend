server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_read_timeout 650s;
        proxy_set_header Host $host;
    }
    location = /ready { proxy_pass http://${API_UPSTREAM}/ready; }
    location / { try_files $uri $uri/ /index.html; }
}
